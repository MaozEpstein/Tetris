<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tetris</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="box"><span class="label">HOLD</span><canvas id="hold" width="56" height="44"></canvas></div>
    <div class="stats">
      <div class="score" id="score">0</div>
      <div class="sub"><span>LV <b id="level">1</b></span><span>LINES <b id="lines">0</b></span><span>BEST <b id="best">0</b></span></div>
    </div>
    <div class="box"><span class="label">NEXT</span><canvas id="next" width="140" height="44"></canvas></div>
  </header>

  <main id="stage">
    <canvas id="board"></canvas>
    <div id="overlay" class="overlay">
      <h1 id="ovTitle">TETRIS</h1>
      <p id="ovText">Swipe to move · Tap to rotate</p>
      <button id="ovBtn">PLAY</button>
    </div>
  </main>

  <footer class="foot">
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
    <span class="hint">← → move · tap rotate · ↓ drop · flick ↓ slam · ↑ hold</span>
  </footer>
</div>
<script src="game.js"></script>
</body>
</html>
